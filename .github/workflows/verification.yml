name: Custom IDS verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
      - run: python tools/validate_notebook.py --executed
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: .venv/bin/python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Build lab image with explicit public CA read permission
        run: docker buildx bake --file compose.yaml --allow=fs.read=/etc/ssl/certs/ca-certificates.crt --load target
      - run: python tools/verify_live.py
      - name: Stop owned lab
        if: always()
        run: docker compose down --volumes
